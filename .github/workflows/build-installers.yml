name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev imagemagick
      - name: Build .deb
        run: |
          chmod +x packaging/build_deb.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION=1.0.0; fi
          VERSION="$VERSION" ./packaging/build_deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: the-pure-scene-deb
          path: dist/*.deb

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .exe
        shell: pwsh
        run: |
          $env:VERSION = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "1.0.0" }
          powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: the-pure-scene-exe
          path: |
            dist/*.exe
